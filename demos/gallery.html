<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blender Copilot - 3D Model Galerisi</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 24px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      gap: 16px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    input[type="text"] {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      width: 240px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .btn-toggle {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-toggle:hover { background: #1e293b; color: var(--accent); }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }
    .media-box {
      width: 100%;
      height: 240px;
      background: #030712;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #030712;
    }
    .info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      text-transform: capitalize;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      background: #1e293b;
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .prompt {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .btn-action {
      flex: 1;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      text-decoration: none;
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      cursor: pointer;
    }
    .btn-action:hover { background: #334155; color: #fff; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .modal-content img {
      max-width: 85vw;
      max-height: 80vh;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Blender Copilot - Model Galerisi</h1>
      <div class="subtitle">Blender programini acmadan tum 3D modelleri, renderlari ve kontak sayfalarini inceleyin.</div>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="Model ara (orn: dragon, car, scout)..." oninput="filterCards()">
      <button class="btn-toggle" onclick="toggleViewMode()">Mod: <span id="viewModeLabel">Izometrik Gorunum</span></button>
    </div>
  </header>

  <div class="grid" id="galleryGrid"></div>

  <div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">Kapat</button>
      <img id="modalImg" src="" alt="Detay">
    </div>
  </div>

": 32, "date": "20260930", "screenshot": "car/screenshot.png", "sheet": "car/sheet.png", "glb": "car/car.glb"}, {"name": "castle", "prompt": "Oyun için düşük poligonlu küçük bir kale modelle: dört köşe kulesi, surlar ve mazgallar, kapı kulesi, ortada bir ana kule.", "tris": 1418, "dims": "10.25 x 2.00 x 10.25 m", "tools": 54, "date": "20260930", "screenshot": "castle/screenshot.png", "sheet": "castle/sheet.png", "glb": "castle/castle.glb"}, {"name": "chest", "prompt": "Oyun için düşük poligonlu bir hazine sandığı modelle: ahşap gövde, kubbeli kapak, metal bantlar, kilit.", "tris": 120, "dims": "0.90 x 0.77 x 0.67 m", "tools": 25, "date": "20260930", "screenshot": "chest/screenshot.png", "sheet": "chest/sheet.png", "glb": "chest/chest.glb"}, {"name": "crate", "prompt": "Bir oyun için düşük poligonlu ahşap sandık modelle, dışa aktar.", "tris": 156, "dims": "0.82 x 0.80 x 0.82 m", "tools": 37, "date": "20260930", "screenshot": "crate/screenshot.png", "sheet": "crate/sheet.png", "glb": "crate/crate.glb"}, {"name": "crate-claudesonnet46", "prompt": "Bir oyun için düşük poligonlu ahşap sandık modelle, dışa aktar.", "tris": 168, "dims": "1.01 x 1.52 x 1.01 m", "tools": 25, "date": "20260930", "screenshot": "crate-claudesonnet46/screenshot.png", "sheet": "crate-claudesonnet46/sheet.png", "glb": "crate-claudesonnet46/crate-claudesonnet46.glb"}, {"name": "dragon", "prompt": "Oyun için düşük poligonlu sevimli bir ejderha modelle: gövde, boyun, kafa, boynuzlar, iki kanat, kuyruk, dört bacak.", "tris": 990, "dims": "2.57 x 2.20 x 2.10 m", "tools": 35, "date": "20260930", "screenshot": "dragon/screenshot.png", "sheet": "dragon/sheet.png", "glb": "dragon/dragon.glb"}, {"name": "fence", "prompt": "Oyun için düşük poligonlu ahşap bir çit modelle: dört-beş kazık ve iki yatay tahta, tek parça olarak bitişik dizilebilecek genişlikte.", "tris": 84, "dims": "2.00 x 1.00 x 0.14 m", "tools": 16, "date": "20260930", "screenshot": "fence/screenshot.png", "sheet": "fence/sheet.png", "glb": "fence/fence.glb"}, {"name": "gravi", "prompt": "Antigravity 3D Maskotu GRAVI: tornalanmis govde, vizor, morfolojik gozler, gradient ve Fresnel isima katmanlari, Cycles render ve animasyonlu glTF.", "tris": 15200, "dims": "0.72 x 0.65 x 0.88 m", "tools": 12, "date": "20261102", "screenshot": "gravi/screenshot.png", "sheet": "gravi/sheet.png", "glb": "gravi/gravi.glb"}, {"name": "house", "prompt": "Oyun için düşük poligonlu küçük bir köy evi modelle (duvar, çatı, kapı, pencere, baca), dışa aktar.", "tris": 100, "dims": "4.60 x 4.20 x 3.79 m", "tools": 23, "date": "20260930", "screenshot": "house/screenshot.png", "sheet": "house/sheet.png", "glb": "house/house.glb"}, {"name": "house-claudesonnet46", "prompt": "Oyun için düşük poligonlu küçük bir köy evi modelle (duvar, çatı, kapı, pencere, baca), dışa aktar.", "tris": 68, "dims": "6.60 x 4.80 x 5.60 m", "tools": 32, "date": "20260930", "screenshot": "house-claudesonnet46/screenshot.png", "sheet": "house-claudesonnet46/sheet.png", "glb": "house-claudesonnet46/house-claudesonnet46.glb"}, {"name": "house-geminiproagent", "prompt": "Oyun için düşük poligonlu küçük bir köy evi modelle (duvar, çatı, kapı, pencere, baca), dışa aktar.", "tris": 56, "dims": "2.40 x 3.50 x 2.27 m", "tools": 22, "date": "20260930", "screenshot": "house-geminiproagent/screenshot.png", "sheet": "house-geminiproagent/sheet.png", "glb": "house-geminiproagent/house-geminiproagent.glb"}, {"name": "house-spacebunnyalpha", "prompt": "Oyun için düşük poligonlu küçük bir köy evi modelle (duvar, çatı, kapı, pencere, baca), dışa aktar.", "tris": 80, "dims": "4.20 x 3.90 x 3.40 m", "tools": 30, "date": "20260930", "screenshot": "house-spacebunnyalpha/screenshot.png", "sheet": "house-spacebunnyalpha/sheet.png", "glb": "house-spacebunnyalpha/house-spacebunnyalpha.glb"}, {"name": "lamp", "prompt": "Oyun için düşük poligonlu bir sokak lambası modelle (direk, kol, abajur), dışa aktar.", "tris": 402, "dims": "1.38 x 4.00 x 0.55 m", "tools": 20, "date": "20260930", "screenshot": "lamp/screenshot.png", "sheet": "lamp/sheet.png", "glb": "lamp/lamp.glb"}, {"name": "ledger-report-cleanup-deepseekv4flash", "prompt": "Bir köy girişi kur: create_prop ile bir house ve iki tree_pine. Önce yerleşimi denemek için geçici bir 'Test' adlı küre (create_primitive SPHERE) ve 'Marker' adlı bir kutu koy, bunlarla konumları belirle. Sonra task_report çağır: nelerin eklendiğine bak ve geçici nesneleri (Test, Marker) delete_object ile sil. Silme onayı gerekirse onayla. Tekrar task_report ile yalnız house ve ağaçların kaldığını doğrula, sonra export_gltf ile village.glb yaz.", "tris": 1988, "dims": "3.45 x 6.76 x 2.97 m", "tools": 25, "date": "20260930", "screenshot": "ledger-report-cleanup-deepseekv4flash/screenshot.png", "sheet": "ledger-report-cleanup-deepseekv4flash/sheet.png", "glb": "ledger-report-cleanup-deepseekv4flash/ledger-report-cleanup-deepseekv4flash.glb"}, {"name": "mesh-doorway-deepseekv4flash", "prompt": "Delikli bir duvar yap: create_primitive CUBE 'Wall' size 2 (yerel koordinatlar -1..1). mesh_edit ile +Y yüzüne INSET_FACES thickness 0.5, sonra -Y yüzüne aynısını yap. Sonra BRIDGE_FACES ile iki iç yüzü bir tünelle birleştir: faces={direction:'+Y', min_area:0.9}, faces_b={direction:'-Y', min_area:0.9} (inset halkası yüzlerinin alanı 0.75, iç yüzün 1.0). set_material ile taş rengi ver, check_model ile kontrol et, frame_view ve capture_viewport ile bak, export_gltf wall.glb.", "tris": 32, "dims": "2.00 x 2.00 x 2.00 m", "tools": 23, "date": "20260930", "screenshot": "mesh-doorway-deepseekv4flash/screenshot.png", "sheet": "mesh-doorway-deepseekv4flash/sheet.png", "glb": "mesh-doorway-deepseekv4flash/mesh-doorway-deepseekv4flash.glb"}, {"name": "model-baked-bench-deepseekv4flash", "prompt": "Bir park bankı modelle: ahşap oturma yüzeyi (kutu), ahşap sırtlık (kutu) ve iki metal ayak (kutular). Ahşap parçalara set_material preset wood, metal ayaklara preset metal ver. Parçaları join_objects ile birleştir, set_origin ile zemine oturt, check_model ile kontrol et ve FAIL'leri düzelt, bake_material ile dokuya pişir (resolution 512) ve export_gltf ile bench.glb yaz. Godot'ya gidecek.", "tris": 48, "dims": "1.60 x 0.85 x 0.50 m", "tools": 32, "date": "20260930", "screenshot": "model-baked-bench-deepseekv4flash/screenshot.png", "sheet": "model-baked-bench-deepseekv4flash/sheet.png", "glb": "model-baked-bench-deepseekv4flash/model-baked-bench-deepseekv4flash.glb"}, {"name": "model-check-fix-deepseekv4flash", "prompt": "create_primitive ile 3 parçalı basit bir masa yap: bir kutu tabla (scale [3,2,0.15], location [0,0,1.0]) ve iki kutu ayak (scale [0.2,0.2,1], konumlar [-1.2,0,0] ve [1.2,0,0]; ayakların alt kenarı z=-0.5'e sarkıyor, bilerek). Hiçbir malzeme verme. Sonra check_model çağır, çıkan FAIL ve WARN maddelerini söylediği araçlarla düzelt (ölçeği uygula, zemine oturt, malzeme ver), check_model ok ve temiz olana kadar tekrarla, join_objects ile birleştir, set_origin, export_gltf table.glb.", "tris": 36, "dims": "3.00 x 1.07 x 2.00 m", "tools": 27, "date": "20260930", "screenshot": "model-check-fix-deepseekv4flash/screenshot.png", "sheet": "model-check-fix-deepseekv4flash/sheet.png", "glb": "model-check-fix-deepseekv4flash/model-check-fix-deepseekv4flash.glb"}, {"name": "mushroom", "prompt": "Oyun için düşük poligonlu büyük bir mantar modelle: kırmızı şapka, beyaz benekler, krem gövde.", "tris": 1644, "dims": "2.00 x 1.84 x 2.00 m", "tools": 27, "date": "20260930", "screenshot": "mushroom/screenshot.png", "sheet": "mushroom/sheet.png", "glb": "mushroom/mushroom.glb"}, {"name": "offroad-scout", "prompt": "AssetSpec IR parametrik arazi aracı (Offroad Scout): zemin temaslı silindirik arazi tekerlekleri, tavan bagajı, tamponlar ve ön cam.", "tris": 1240, "dims": "2.20 x 4.20 x 1.80 m", "tools": 3, "date": "20261102", "screenshot": "offroad-scout/screenshot.png", "sheet": "offroad-scout/sheet.png", "glb": "offroad-scout/offroad-scout.glb"}, {"name": "rifle", "prompt": "Oyun için düşük poligonlu bir savaş dönem     let viewMode = 'screenshot';

    function renderGrid() {
      const grid = document.getElementById('galleryGrid');
      const q = document.getElementById('search').value.toLowerCase();
      grid.innerHTML = '';

      models.filter(m => m.name.toLowerCase().includes(q) || m.prompt.toLowerCase().includes(q)).forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let mediaHtml = '';
        if (viewMode === '3d' && m.glb) {
          mediaHtml = `<model-viewer src="${m.glb}" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
        } else {
          const src = viewMode === 'sheet' ? m.sheet : m.screenshot;
          mediaHtml = `<div class="media-box" onclick="openModal('${viewMode === 'sheet' ? m.sheet : m.screenshot}')">
            <img src="${src}" alt="${m.name}" loading="lazy">
          </div>`;
        }

        card.innerHTML = `
          ${mediaHtml}
          <div class="info">
            <div class="title-row">
              <span class="title">${m.name}</span>
              <span class="badge">${m.tris} tris</span>
            </div>
            <div class="prompt" title="${m.prompt}">${m.prompt}</div>
            <div class="meta">
              <span>Boyut: ${m.dims}</span>
              <span>Tarih: ${m.date}</span>
            </div>
            <div class="actions">
              <button class="btn-action" onclick="openModal('${m.sheet}')">4 Aci Sheet</button>
              ${m.glb ? `<a class="btn-action" href="${m.glb}" download>GLB Indir</a>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCards() { renderGrid(); }

    function toggleViewMode() {
      if (viewMode === 'screenshot') {
        viewMode = 'sheet';
        document.getElementById('viewModeLabel').innerText = '4-Aci Kontak Sayfasi';
      } else if (viewMode === 'sheet') {
        viewMode = '3d';
        document.getElementById('viewModeLabel').innerText = 'Interaktif 3D WebGL';
      } else {
        viewMode = 'screenshot';
        document.getElementById('viewModeLabel').innerText = 'Izometrik Gorunum';
      }
      renderGrid();
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    renderGrid();
  </script>
