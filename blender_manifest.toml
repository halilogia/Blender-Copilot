schema_version = "1.0.0"

id = "blender_ai_sidebar"
version = "1.5.0"
name = "Blender - Copilot"
tagline = "Autonomous AI Agent & Grounding Copilot for Blender"
maintainer = "Halil Emre"
type = "add-on"

# Optional links
website = "https://github.com/halilogia/Blender-AI-Sidebar"

# Supported Blender versions
blender_version_min = "4.2.0"

# License (SPDX format)
license = [
  "GPL-3.0-or-later",
]

# Copyright
copyright = [
  "2026 Halil Emre",
]

[permissions]
network = "LLM provider access and a local-only MCP bridge (127.0.0.1)"
files = "Writes exported .glb files and the MCP bridge settings"

[build]
paths_exclude_pattern = [
  "/plugin/",
  "/.claude-plugin/",
  "/archives/",
  "/scripts/",
  "/demos/",
  "/brain/",
]
